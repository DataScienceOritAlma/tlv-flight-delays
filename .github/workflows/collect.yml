name: Collect flight board

on:
  schedule:
    # Four snapshots a day (UTC). The source keeps about one day of history.
    - cron: "23 3,9,15,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect.py
      - .github/workflows/collect.yml

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Save snapshot
        run: python collect.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "Add flight board snapshot"
          git pull --rebase
          git push
